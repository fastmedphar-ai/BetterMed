<script>
/* ================= Core ================= */
const S = { boot: null, page: 'dashboard', quiz: null, media: {}, imp: null, bank: { page: 0, search: '', subject: '', deck: null }, ai: {}, gen: null, chat: [] };
const view = document.getElementById('view');
const PIX = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
const L5 = ['A', 'B', 'C', 'D', 'E'];
const PASS = 75, FLOOR = 50;
// The 12 PLE subjects in PRC's order since the March 2026 PLE: [name, day, start time]
const PLE = [
  ['Physiology', 1, '8:00 AM'], ['Legal Medicine', 1, '11:00 AM'], ['Pathology', 1, '2:00 PM'],
  ['Biochemistry', 2, '8:00 AM'], ['Anatomy and Histology', 2, '11:00 AM'], ['Microbiology and Parasitology', 2, '2:00 PM'],
  ['Obstetrics and Gynecology', 3, '8:00 AM'], ['Pediatrics and Nutrition', 3, '11:00 AM'], ['Preventive Medicine', 3, '2:00 PM'],
  ['Pharmacology and Therapeutics', 4, '8:00 AM'], ['Surgery', 4, '11:00 AM'], ['Medicine', 4, '2:00 PM'],
];
const PLE_SUBJECTS = PLE.map(p => p[0]);
const SEC_PER_ITEM = 72; // 100 items in 2 hours
const SHORT = { 'Legal Medicine': 'Legal Med', 'Anatomy and Histology': 'Anatomy', 'Microbiology and Parasitology': 'Micro-Para', 'Obstetrics and Gynecology': 'OB-Gyn', 'Pediatrics and Nutrition': 'Pediatrics', 'Preventive Medicine': 'Prev Med', 'Pharmacology and Therapeutics': 'Pharmacology' };
const short = s => SHORT[s] || s;
const pidx = n => { const i = PLE_SUBJECTS.indexOf(n); return i < 0 ? 99 : i; };
const byPle = (a, b) => pidx(a.subject || a.name) - pidx(b.subject || b.name);
const PLE_RULES = [[/legal|jurisprud|ethic|forensic/, 'Legal Medicine'], [/prevent|community|public health|epidemiol|biostat/, 'Preventive Medicine'], [/pharma/, 'Pharmacology and Therapeutics'], [/patho| path /, 'Pathology'], [/micro|parasit|immunol/, 'Microbiology and Parasitology'], [/biochem/, 'Biochemistry'], [/physio/, 'Physiology'], [/anat|histo|embryo/, 'Anatomy and Histology'], [/pedia|paedia| peds |nutrition/, 'Pediatrics and Nutrition'], [/obstet|gyne| gyn | ob |obgyn/, 'Obstetrics and Gynecology'], [/surg/, 'Surgery'], [/internal|medicine| im /, 'Medicine']];
function pleName(s) { const t = ' ' + String(s || '').toLowerCase().replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, ' ').trim() + ' '; if (!t.trim()) return ''; const r = PLE_RULES.find(x => x[0].test(t)); return r ? r[1] : ''; }
const BLOOM = ['Remember', 'Understand', 'Apply', 'Analyze', 'Evaluate', 'Create'];
const tosOf = s => (S.boot.tos || []).find(t => t.subject === s);
const areaOpts = (s, sel) => (tosOf(s) ? tosOf(s).areas : []).map(a => `<option value="${a.code}" ${a.code === sel ? 'selected' : ''}>${esc(a.name)} (${a.items} items)</option>`).join('');
const modeName = m => ({ exam: 'Exam', block: 'PLE block', tutor: 'Tutor' }[m] || 'Tutor');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const _ta = document.createElement('textarea');
const strip = h => { _ta.innerHTML = String(h || '').replace(/<br\s*\/?>/gi, ' ').replace(/<[^>]*>/g, ' '); return _ta.value.replace(/\s+/g, ' ').trim(); };
const tone = p => p >= PASS ? 'hi' : p >= FLOOR ? 'mid' : 'lo';
const J = v => esc(JSON.stringify(v));

function run(fn, ...args) {
  return new Promise((res, rej) => {
    if (window.google && google.script && google.script.run) {
      google.script.run.withSuccessHandler(res).withFailureHandler(e => { toast(e.message || String(e), true); rej(e); })[fn](...args);
    } else if (window.MOCK && MOCK[fn]) {
      setTimeout(() => { try { res(MOCK[fn](...args)); } catch (e) { toast(e.message, true); rej(e); } }, 80);
    } else rej(new Error('No backend: ' + fn));
  });
}
function toast(msg, err) {
  const d = document.createElement('div'); d.textContent = msg; if (err) d.className = 'err';
  document.getElementById('toast').appendChild(d); setTimeout(() => d.remove(), 4500);
}
function openModal(html) { document.getElementById('modalBox').innerHTML = html; document.getElementById('modal').classList.remove('hidden'); }
function closeModal() { document.getElementById('modal').classList.add('hidden'); }
const loading = t => `<div class="card"><span class="spin"></span>${esc(t || 'Loading…')}</div>`;

function md(t) {
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>');
  let html = '', list = false;
  String(t || '').split('\n').forEach(ln => {
    const l = ln.trim();
    if (/^([-*•]|\d+[.)])\s+/.test(l)) { if (!list) { html += '<ul>'; list = true; } html += '<li>' + inline(l.replace(/^([-*•]|\d+[.)])\s+/, '')) + '</li>'; return; }
    if (list) { html += '</ul>'; list = false; }
    if (!l) return;
    const h = l.match(/^#{1,6}\s+(.*)/);
    html += h ? '<h4>' + inline(h[1]) + '</h4>' : '<p>' + inline(l) + '</p>';
  });
  return '<div class="md">' + html + (list ? '</ul>' : '') + '</div>';
}

/* ================= Icons & navigation ================= */
const svg = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I = {
  dashboard: svg('<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'),
  maker: svg('<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M12 12v6M9 15h6"/>'),
  analytics: svg('<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 16v-4M12 16V8M16 16v-6"/>'),
  bank: svg('<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/>'),
  ai: svg('<path d="M12 3l1.8 4.6L18.5 9l-4.7 1.4L12 15l-1.8-4.6L5.5 9l4.7-1.4z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/>'),
  import: svg('<path d="M12 15V3M7 8l5-5 5 5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/>'),
  settings: svg('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>'),
  book: svg('<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/>'),
  check: svg('<path d="M20 6 9 17l-5-5"/>'),
  target: svg('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>'),
  cal: svg('<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>'),
  trophy: svg('<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>'),
  clock: svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
  star: svg('<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>'),
  up: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="m3 17 6-6 4 4 8-8M15 7h6v6"/></svg>',
  down: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="m3 7 6 6 4-4 8 8M15 17h6v-6"/></svg>',
  arrow: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M7 17 17 7M8 7h9v9"/></svg>',
  dl: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>',
};
const NAV = [
  ['Main menu', [['dashboard', 'Dashboard'], ['maker', 'Quiz Maker'], ['analytics', 'Results & Analytics'], ['bank', 'Question Bank'], ['ai', 'AI Tutor']]],
  ['Manage', [['import', 'Import from Anki'], ['settings', 'Settings']]],
];
const TITLES = { dashboard: '', maker: 'Quiz Maker', analytics: 'Results & Analytics', bank: 'Question Bank', ai: 'AI Tutor', import: 'Import from Anki', settings: 'Settings' };
function drawNav() {
  document.getElementById('nav').innerHTML = NAV.map(([lbl, items]) => `<div class="navlbl">${lbl}</div>` + items.map(([k, l]) =>
    `<a class="${S.page === k ? 'on' : ''}" onclick="go('${k}')">${I[k]}${l}${k === 'ai' ? '<span class="badge">AI</span>' : ''}</a>`).join('')).join('');
  const d = daysLeft();
  document.getElementById('sideFoot').innerHTML = d != null ? `Board exam in<b>${d} days</b>${esc(S.boot.settings.ExamDate)}` : `<a onclick="go('settings')" style="cursor:pointer">Set your exam date for a countdown</a>`;
}
function head(title, sub) { document.getElementById('title').textContent = title; document.getElementById('eyebrow').textContent = sub || ''; }
function daysLeft() { const d = S.boot && S.boot.settings && S.boot.settings.ExamDate; return d ? Math.ceil((new Date(d + 'T00:00:00') - new Date()) / 864e5) : null; }
function greet() {
  const h = new Date().getHours(), name = (S.boot.settings.DisplayName || '').trim();
  return (h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening') + (name ? ', ' + name : '');
}
function go(p) {
  if (S.quiz && !S.quiz.done && p !== 'quiz' && !window.confirm('Leave this quiz? Answers in this session will not be saved.')) return;
  if (p !== 'quiz') S.quiz = null;
  S.page = p; document.body.classList.remove('nav-open'); drawNav(); setWho();
  const today = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  head(p === 'dashboard' ? greet() : TITLES[p] || '', p === 'dashboard' ? today : '');
  window.scrollTo(0, 0);
  R[p](view);
}

/* ================= Widgets ================= */
function kpi(label, value, unit, icon, cls, chip) {
  return `<div class="kpi"><div class="l">${esc(label)}</div><span class="ic ${cls}">${I[icon]}</span>
    <div class="v">${value}${unit ? `<small>${esc(unit)}</small>` : ''}${chip || ''}</div></div>`;
}
function deltaChip(trend) {
  if (trend.length < 2) return '';
  const k = Math.min(5, Math.floor(trend.length / 2));
  const avg = a => a.reduce((s, t) => s + t.score, 0) / a.length;
  const d = Math.round((avg(trend.slice(-k)) - avg(trend.slice(-2 * k, -k))) * 10) / 10;
  return `<span class="chip ${d >= 0 ? 'up' : 'down'}" title="Last ${k} sessions vs the ${k} before">${d >= 0 ? '+' : ''}${d}% ${d >= 0 ? I.up : I.down}</span>`;
}
function smooth(pts) {
  if (pts.length < 2) return '';
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    d += ` C${p1[0] + (p2[0] - p0[0]) / 6},${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6},${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]},${p2[1]}`;
  }
  return d;
}
let _cid = 0;
function trendChart(trend) {
  if (!trend.length) return '<div class="empty">Finish a quiz and your scores will appear here.</div>';
  const id = 'c' + (++_cid), W = 720, H = 250, pl = 34, pr = 8, pt = 40, pb = 28, iw = W - pl - pr, ih = H - pt - pb;
  const n = trend.length, slot = iw / n, bw = Math.max(8, Math.min(26, slot * 0.46));
  const x = i => pl + slot * (i + 0.5), y = v => pt + ih * (1 - v / 100);
  const ma = trend.map((t, i) => { const s = trend.slice(Math.max(0, i - 2), i + 1); return s.reduce((a, b) => a + b.score, 0) / s.length; });
  const grid = [0, 25, 50, 75, 100].map(v => `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="${v === PASS ? '#E3B341' : '#EDF1F6'}" stroke-width="${v === PASS ? 1.6 : 1}" ${v === PASS ? 'stroke-dasharray="6 5"' : ''}/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#8590A0">${v}</text>`).join('');
  const every = Math.ceil(n / 10);
  const bars = trend.map((t, i) => `<g class="tb" data-i="${i}">
      <rect x="${x(i) - bw / 2}" y="${pt}" width="${bw}" height="${ih}" rx="${bw / 2}" fill="#F3F5F9"/>
      <rect x="${x(i) - bw / 2}" y="${Math.min(y(t.score), y(0) - bw)}" width="${bw}" height="${Math.max(bw, y(0) - y(t.score))}" rx="${bw / 2}" fill="#C4D5EA"/>
      <rect class="hl" x="${x(i) - bw / 2}" y="${Math.min(y(t.score), y(0) - bw)}" width="${bw}" height="${Math.max(bw, y(0) - y(t.score))}" rx="${bw / 2}" fill="#1E3A5F"/>
      ${i % every === 0 || i === n - 1 ? `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="#8590A0">${esc(t.date)}</text>` : ''}</g>`).join('');
  const line = `<path d="${smooth(ma.map((v, i) => [x(i), y(v)]))}" fill="none" stroke="#1E3A5F" stroke-width="2.4"/>` +
    ma.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="3.2" fill="#fff" stroke="#1E3A5F" stroke-width="2"/>`).join('');
  const tips = trend.map((t, i) => {
    const tx = Math.max(pl + 50, Math.min(W - pr - 50, x(i))), ty = Math.max(2, Math.min(y(t.score), y(0) - bw) - 46);
    return `<g class="tt" data-i="${i}"><rect x="${tx - 50}" y="${ty}" width="100" height="38" rx="9" fill="#1E3A5F"/>
      <text x="${tx - 40}" y="${ty + 16}" font-size="10.5" fill="#A9C4E2">Score</text><text x="${tx + 40}" y="${ty + 16}" font-size="11.5" font-weight="800" fill="#fff" text-anchor="end">${t.score}%</text>
      <text x="${tx - 40}" y="${ty + 30}" font-size="10.5" fill="#A9C4E2">${t.correct} of ${t.total}</text><text x="${tx + 40}" y="${ty + 30}" font-size="10.5" fill="#fff" text-anchor="end">${modeName(t.mode)}</text></g>
      <rect x="${x(i) - slot / 2}" y="0" width="${slot}" height="${H}" fill="transparent" onmouseenter="hlBar('${id}',${i})"/>`;
  }).join('');
  setTimeout(() => hlBar(id, n - 1), 0);
  return `<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Score per session">${grid}${bars}${line}${tips}</svg></div>`;
}
function growthChart(trend) {
  if (trend.length < 2) return '<div class="empty">Two or more sessions draw your growth curve.</div>';
  const W = 360, H = 200, pl = 30, pr = 12, pt = 46, pb = 24, iw = W - pl - pr, ih = H - pt - pb, n = trend.length;
  const x = i => pl + iw * i / (n - 1), y = v => pt + ih * (1 - v / 100);
  const pts = trend.map((t, i) => [x(i), y(t.score)]), line = smooth(pts);
  const last = trend[n - 1], first = trend[0], d = Math.round((last.score - first.score) * 10) / 10;
  const lx = x(n - 1), ly = y(last.score), tx = Math.min(W - pr - 38, Math.max(pl + 38, lx));
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Score growth">
    <defs><linearGradient id="gg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2B5C8F" stop-opacity=".22"/><stop offset="1" stop-color="#2B5C8F" stop-opacity="0"/></linearGradient></defs>
    ${[0, 50, 100].map(v => `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="#EDF1F6"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="#8590A0">${v}</text>`).join('')}
    <line x1="${pl}" x2="${W - pr}" y1="${y(PASS)}" y2="${y(PASS)}" stroke="#E3B341" stroke-dasharray="5 4"/>
    <rect x="${lx - 14}" y="${pt - 6}" width="28" height="${ih + 6}" rx="8" fill="#E6EEF7"/>
    <path d="${line} L${x(n - 1)},${y(0)} L${x(0)},${y(0)} Z" fill="url(#gg)"/>
    <path d="${line}" fill="none" stroke="#1E3A5F" stroke-width="2.4"/>
    <circle cx="${lx}" cy="${ly}" r="5" fill="#1E3A5F" stroke="#fff" stroke-width="2"/>
    <rect x="${tx - 38}" y="6" width="76" height="28" rx="8" fill="#1E3A5F"/>
    <text x="${tx}" y="24.5" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">${d >= 0 ? '+' : ''}${d}%</text>
    <text x="${x(0)}" y="${H - 4}" font-size="10.5" fill="#8590A0">${esc(first.date)}</text><text x="${x(n - 1)}" y="${H - 4}" font-size="10.5" fill="#2B5C8F" text-anchor="end">Latest</text>
  </svg><div class="sub">Change from your first to your latest session in this view.</div></div>`;
}
function hlBar(id, i) {
  const el = document.getElementById(id); if (!el) return;
  el.querySelectorAll('.tb .hl,.tt').forEach(e => e.style.opacity = 0);
  el.querySelectorAll(`[data-i="${i}"] .hl, .tt[data-i="${i}"]`).forEach(e => e.style.opacity = 1);
}
const flag = m => !m.attempts ? '<span class="flag X">New</span>' : m.accuracy < FLOOR ? '<span class="flag C" title="Under the 50% subject floor">Below 50</span>' : m.accuracy < PASS ? '<span class="flag L">Below 75</span>' : '<span class="flag N">Passing</span>';
function subjList(m, limit) {
  if (!m.length) return '<div class="empty">Import your Anki deck to see subjects here.</div>';
  return `<div class="slist">${(limit ? m.slice(0, limit) : m).map(x => `<div class="s"><span class="nm">${esc(x.subject)}${flag(x)}</span><span class="pc ${x.attempts ? tone(x.accuracy) : 'muted'}">${x.attempts ? x.accuracy + '%' : '—'}</span>
    <div class="track"><i class="bg-${tone(x.accuracy)}" style="width:${x.accuracy}%"></i><b title="75% passing line"></b></div></div>`).join('')}</div>`;
}
function ring(t, m) {
  const N = 60, ok = t.answered ? Math.round(t.correct / t.answered * N) : 0, cx = 75, cy = 75;
  const ticks = Array.from({ length: N }, (_, i) => {
    const a = (i / N) * Math.PI * 2 - Math.PI / 2, r1 = 56, r2 = 70;
    return `<line x1="${cx + r1 * Math.cos(a)}" y1="${cy + r1 * Math.sin(a)}" x2="${cx + r2 * Math.cos(a)}" y2="${cy + r2 * Math.sin(a)}" stroke="${!t.answered ? '#E4E9F0' : i < ok ? '#2B5C8F' : '#E3B341'}" stroke-width="3.2" stroke-linecap="round"/>`;
  }).join('');
  const att = m.filter(x => x.attempts), c = k => att.filter(k).length;
  return `<div class="ringwrap"><svg viewBox="0 0 150 150">${ticks}<text x="75" y="70" text-anchor="middle" font-size="11" fill="#8590A0">Answers</text><text x="75" y="92" text-anchor="middle" font-size="24" font-weight="800" fill="#141C28">${t.answered.toLocaleString()}</text></svg>
    <div class="rleg"><div style="border-color:#2B5C8F"><span>Correct</span><b>${t.answered ? Math.round(t.correct / t.answered * 100) : 0}%</b></div>
    <div style="border-color:#E3B341"><span>Wrong</span><b>${t.answered ? 100 - Math.round(t.correct / t.answered * 100) : 0}%</b></div>
    <div style="border-color:#D6604B"><span>Subjects under 50%</span><b>${c(x => x.accuracy < FLOOR)}</b></div></div></div>`;
}
function radar(m) {
  const s = PLE_SUBJECTS.map(n => m.find(x => x.subject === n) || { subject: n, accuracy: 0, attempts: 0 });
  const cx = 170, cy = 140, R = 100, n = s.length, ang = i => (i / n) * Math.PI * 2 - Math.PI / 2;
  const pt = (i, v) => [cx + R * v / 100 * Math.cos(ang(i)), cy + R * v / 100 * Math.sin(ang(i))];
  const rings = [25, 50, 75, 100].map(v => `<polygon points="${s.map((_, i) => pt(i, v).join(',')).join(' ')}" fill="none" stroke="${v === PASS ? '#E3B341' : '#E4E9F0'}" ${v === PASS ? 'stroke-dasharray="5 4"' : ''}/>`).join('');
  const spokes = s.map((_, i) => `<line x1="${cx}" y1="${cy}" x2="${pt(i, 100)[0]}" y2="${pt(i, 100)[1]}" stroke="#E4E9F0"/>`).join('');
  const poly = `<polygon points="${s.map((x, i) => pt(i, Math.max(3, x.accuracy)).join(',')).join(' ')}" fill="rgba(43,92,143,.28)" stroke="#2B5C8F" stroke-width="2"/>`;
  const labels = s.map((x, i) => { const [lx, ly] = pt(i, 122), a = Math.cos(ang(i)); return `<text x="${lx}" y="${ly + 4}" font-size="11" fill="#475263" text-anchor="${Math.abs(a) < .3 ? 'middle' : a > 0 ? 'start' : 'end'}">${esc(short(x.subject))}</text>`; }).join('');
  return `<div class="radar"><svg viewBox="-40 0 420 285">${rings}${spokes}${poly}${labels}</svg></div>`;
}
function heatmap(h) {
  if (!h.rows.length) return '<div class="empty">Your subject scores per session will fill this grid.</div>';
  const col = v => v == null ? '#F1F4F8' : v < 40 ? '#DCE5F0' : v < 60 ? '#A9BCD6' : v < 80 ? '#5B82AE' : '#1E3A5F';
  const n = h.sessions.length;
  return `<div style="display:grid;grid-template-columns:minmax(90px,140px) repeat(${n},minmax(18px,1fr));gap:5px;align-items:center">

function priorityTable(m) {

   ${m.filter(x => x.bank || x.attempts).map(x => { const [p, c, a, pool] = P(x); return `<tr><td style="color:${c};font-weight:800">${p}</td><td style="font-weight:600">${esc(x.subject)}</td>
     <td>${x.attempts ? `${x.accuracy}% of ${x.attempts} answers` : 'Not started'}<div class="small muted">seen ${Math.min(x.seen, x.bank)} of ${x.bank}</div></td><td>${a}</td>

function rich(html) {
  let h = String(html || '').replace(/<script[\s\S]*?<\/script>/gi, '').replace(/\son\w+\s*=\s*(["']).*?\1/gi, '');
  h = h.replace(/\[sound:([^\]]+)\]/g, (m, n) => `<div class="av" data-av="${esc(n)}"><span class="spin"></span></div>`);
  h = h.replace(/<(video|audio)\b[^>]*>[\s\S]*?<source[^>]*\ssrc\s*=\s*(["'])(.*?)\2[\s\S]*?<\/\1>/gi, (m, t, q, src) => /^(https?:|data:)/i.test(src) ? m : `<div class="av" data-av="${src}"><span class="spin"></span></div>`);
  h = h.replace(/<(video|audio)\b[^>]*\ssrc\s*=\s*(["'])(.*?)\2[^>]*>(?:[\s\S]*?<\/\1>)?/gi, (m, t, q, src) => /^(https?:|data:)/i.test(src) ? m : `<div class="av" data-av="${src}"><span class="spin"></span></div>`);
  h = h.replace(/<img\b([^>]*?)\ssrc\s*=\s*(["'])(.*?)\2/gi, (m, pre, q, src) => /^(https?:|data:)/i.test(src) ? m : `<img${pre} data-media="${src}" src="${PIX}"`);
  return h;
}
async function hydrate(root) {
  const imgs = [...root.querySelectorAll('img[data-media]')], avs = [...root.querySelectorAll('[data-av]')];
  imgs.forEach(im => im.onclick = () => openModal(`<img src="${im.src}">`));
  const names = [...new Set([...imgs.map(i => i.dataset.media), ...avs.map(a => a.dataset.av)])].filter(n => !S.media[n]);
  if (names.length) {
    try { Object.assign(S.media, await run('getMediaBatch', names)); } catch (e) { return; }
  }
  imgs.forEach(im => {
    const m = S.media[im.dataset.media];
    if (m && m.type === 'image') im.src = m.src;
    else im.outerHTML = `<span class="missing">Missing image: ${esc(im.dataset.media)}</span>`;
  });
  avs.forEach(a => {
    const m = S.media[a.dataset.av];
    if (!m || m.type === 'missing' || m.type === 'image') a.innerHTML = `<span class="missing">Missing media: ${esc(a.dataset.av)}</span>`;
    else { a.classList.toggle('audio', m.type === 'audio'); a.innerHTML = `<iframe src="${m.src}" allow="autoplay; fullscreen" allowfullscreen></iframe>`; }
  });
}

function fmtT(s) { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); }
function tick() {
  const Q = S.quiz; if (!Q || Q.done) return;
  const el = document.getElementById('clock'); if (!el) return;
  const s = (Date.now() - Q.started) / 1000;
  if (!Q.timeLimit) { el.textContent = fmtT(s); return; }
  const left = Q.timeLimit - s; el.textContent = fmtT(left); el.classList.toggle('lo', left < 600);
  const pe = document.getElementById('pace');
  if (pe) { const done = Q.answers.filter(a => a.chosen).length, exp = Math.floor(s / SEC_PER_ITEM); pe.textContent = done >= exp ? 'On pace (72 seconds per item)' : (exp - done) + ' items behind the 72-second pace'; }

}
setInterval(tick, 1000);
function logTime() { const Q = S.quiz; Q.answers[Q.idx].seconds += (Date.now() - Q.shownAt) / 1000; Q.shownAt = Date.now(); }

function questionBlock(q, o) {
  const reveal = o.reveal, chosen = o.chosen;
  const ch = q.choices.map(c => {
    let cls = '';
    if (reveal) { if (c.key === q.answer) cls = 'right'; else if (c.key === chosen) cls = 'wrong'; }
    else if (c.key === chosen) cls = 'sel';
    return `<button class="choice ${cls}" ${o.onPick && !reveal ? `onclick="${o.onPick}('${c.key}')"` : 'disabled'}><span class="key">${c.key}</span><span class="rich">${rich(c.html)}</span></button>`;
  }).join('');
  let fb = '';
  if (reveal) {
    const v = !q.answer ? '<span class="mid">This card has no answer key. Check the rationale.</span>' : !chosen ? (o.onPick === undefined && o.chosen === undefined ? `<span class="hi">Answer: ${q.answer}</span>` : `<span class="muted">Not answered. The answer is ${q.answer}.</span>`) : chosen === q.answer ? '<span class="hi">Correct</span>' : `<span class="lo">Incorrect. The answer is ${q.answer}.</span>`;

  }
  return `<div class="stem rich">${rich(q.question)}</div><div class="choices">${ch}</div>${fb}`;
}

function parseDelimited(s, sep) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (q) { if (c === '"') { if (s[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"' && f === '') q = true;
    else if (c === sep) { row.push(f); f = ''; }
    else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (c !== '\r') f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows;
}
function parseAnki(text) {
  const lines = text.replace(/^﻿/, '').split('\n');
  const meta = { sep: '\t' }; let i = 0;
  while (i < lines.length && lines[i].startsWith('#')) {
    const m = lines[i].match(/^#([^:]+):(.*)$/);
    if (m) {
      const k = m[1].trim().toLowerCase(), val = m[2].trim();
      if (k === 'separator') meta.sep = { tab: '\t', comma: ',', semicolon: ';', space: ' ', pipe: '|', colon: ':' }[val.toLowerCase()] || val;
      else if (/ column$/.test(k)) meta[k.replace(/ column$/, '')] = parseInt(val, 10) - 1;
      else if (k === 'columns') meta.columns = val;
    }
    i++;
  }
  if (meta.columns) meta.columns = meta.columns.split(meta.sep);
  const rows = parseDelimited(lines.slice(i).join('\n'), meta.sep).filter(r => r.some(x => x.trim()));
  return { meta, rows };
}

const ROLES = [['ignore', '— ignore —'], ['question', 'Question / stem'], ['A', 'Choice A'], ['B', 'Choice B'], ['C', 'Choice C'], ['D', 'Choice D'], ['E', 'Choice E'], ['choices', 'All choices in one field'], ['answer', 'Answer / correct key'], ['rationale', 'Rationale / explanation'], ['extra', 'Extra (add to rationale)'], ['subject', 'Subject'], ['topic', 'Topic'], ['tags', 'Tags'], ['guid', 'Anki ID (GUID)'], ['deck', 'Deck name'], ['notetype', 'Note type']];

function autoMap(meta, rows) {
  const n = Math.max(...rows.slice(0, 100).map(r => r.length));
  const roles = Array(n).fill('ignore');
  ['guid', 'deck', 'tags', 'notetype'].forEach(k => { if (meta[k] != null && meta[k] < n) roles[meta[k]] = k; });
  (meta.columns || []).forEach((nm, i) => {
    if (roles[i] !== 'ignore') return;

    if (I.subjMode === 'deck' && deck.length) { subject = deck[Math.min(I.deckLevel, deck.length) - 1]; if (!topic && deck[I.deckLevel]) topic = deck.slice(I.deckLevel).join(' › '); }

    else if (I.subjMode === 'fixed') subject = I.fixed.trim() || 'Uncategorized';
    const guid = get('guid')[0] || hash(strip(question) + '|' + choices.map(strip).join('|'));
    return { guid, subject: pleName(subject.trim()) || subject.trim(), topic, question, choices, answer, rationale, tags: get('tags').join(' '), deck: deck.join('::') };
  });
}

function mediaRefs(items) {
  const set = new Set();
  const scan = h => {
    String(h || '').replace(/<(?:img|source|video|audio)\b[^>]*\ssrc\s*=\s*(["'])(.*?)\1/gi, (m, q, s) => { if (!/^(https?:|data:)/i.test(s)) { _ta.innerHTML = s; set.add(_ta.value); } return m; })
      .replace(/\[sound:([^\]]+)\]/g, (m, s) => { set.add(s); return m; });
  };
  items.forEach(it => { scan(it.question); it.choices.forEach(scan); scan(it.rationale); });
  return [...set];
}

async function doImport() {
  const items = buildItems(impRows()).filter(x => x.choices.filter(Boolean).length >= 2);
  if (!items.length) return toast('Nothing to import — check the mapping.', true);
  const btn = document.getElementById('impBtn'), box = document.getElementById('impProg');
  btn.disabled = true;
  box.innerHTML = '<div class="prog"><i id="impBar"></i></div><div class="small muted" id="impTxt"></div>';
  let added = 0, updated = 0, truncated = 0;
  const CH = 150;
  for (let i = 0; i < items.length; i += CH) {
    try {
      const r = await run('importRows', items.slice(i, i + CH));
      added += r.added; updated += r.updated; truncated += r.truncated;
    } catch (e) { btn.disabled = false; return; }
    document.getElementById('impBar').style.width = Math.min(100, (i + CH) / items.length * 100) + '%';
    document.getElementById('impTxt').textContent = `Saved ${Math.min(i + CH, items.length)} of ${items.length}…`;
  }
  let tg = { tagged: 0 }; try { tg = await run('tosAutoTag'); } catch (e) { }
  S.boot = await run('getBootstrap');
  const media = mediaRefs(items);
  let up = null;
  if (S.imp.apkg && media.length && S.withMedia) {
    document.getElementById('impBar').style.width = '0%';
    try { up = await uploadApkgMedia(media, t => { document.getElementById('impTxt').textContent = t; }); }
    catch (e) { up = { error: true }; }
  }
  const mediaNote = up ? (up.error ? `<p class="warn-note small">The questions were saved, but saving the pictures & videos stopped partway. Click Import again to finish; files already saved are skipped.</p>`
    : `<p class="ok-note small">Pictures & videos: <b>${up.saved}</b> saved to your Drive${up.had ? `, ${up.had} were already there` : ''}.${up.missing.length ? ` ${up.missing.length} referenced by the cards weren't in the .apkg.` : ''}${up.big.length ? ` ${up.big.length} over 20 MB were skipped; upload them to the media folder yourself and click Re-index: ${esc(up.big.join(', '))}.` : ''}</p>`) : (S.imp.apkg && media.length ? `<p class="small muted">${media.length} pictures/videos were not saved (questions only). Tick “Also save pictures & videos” and import this deck again to add them.</p>` : '');
  box.innerHTML = mediaNote + `<p class="ok-note">Done: <b>${added}</b> new, <b>${updated}</b> updated${truncated ? `, ${truncated} very long fields trimmed` : ''}. Re-importing the same deck later updates cards instead of duplicating them. ${tg.tagged} were matched to Table of Specifications areas by keywords; tag the rest in Results & Analytics.</p>
   ${S.imp.apkg ? '' : media.length ? `<div class="field"><label>${media.length} media files used by these cards</label><p class="small muted" style="margin-top:0">Upload these from <b>collection.media</b> to your Drive media folder (step 3), then click Re-index.</p><textarea class="code" readonly onclick="this.select()">${esc(media.join('\n'))}</textarea></div>` : '<p class="small muted">These cards don\'t use any pictures or videos.</p>'}`;
  btn.disabled = false;
  return { added, updated, up };
}
